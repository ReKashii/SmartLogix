server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: ms-pedidos
          uri: http://localhost:8081
          predicates:
            - Path=/api/pedidos/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}

        - id: ms-inventario
          uri: http://localhost:8082
          predicates:
            - Path=/api/inventario/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}

management:
  endpoints:
    web:
      exposure:
        include: health,info
