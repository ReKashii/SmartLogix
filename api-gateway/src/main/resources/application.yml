server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: ms-pedidos
          uri: http://localhost:8081
          predicates:
            - Path=/api/pedidos/**
          filters:
            - StripPrefix=1
        - id: ms-inventario
          uri: http://localhost:8082
          predicates:
            - Path=/api/inventario/**
          filters:
            - StripPrefix=1
        - id: ms-envios
          uri: http://localhost:8083
          predicates:
            - Path=/api/envios/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info
