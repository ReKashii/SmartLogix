server:
  port: 8083

spring:
  application:
    name: ms-envios
  datasource:
    url: jdbc:postgresql://localhost:5433/envios_db
    username: user_envios
    password: password_envios
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

logging:
  level:
    org.hibernate.SQL: DEBUG
